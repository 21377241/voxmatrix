mesh-speaker-attribution:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"
          - type: text
            value: |-
              Transcribe the meeting and assign each utterance to a speaker.

              Return JSON only (no markdown fences, no extra keys):
              {"utterances":[{"speaker":"speaker_1","text":"..."}]}

              Requirements:
              - Top-level object MUST have key "utterances" (an array). Do not return a bare array.
              - Every item MUST use keys "speaker" and "text" exactly (never {"speaker_1","text":...}).
              - speaker ids are anonymous labels such as speaker_1, speaker_2, ...
              - Keep chronological order; do not invent placeholder text.
              - Do not wrap the JSON in ``` fences.
