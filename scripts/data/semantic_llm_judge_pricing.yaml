# Default public OpenAI-equivalent list prices (USD / 1M tokens).
# Override with SEMANTIC_JUDGE_PRICE_JSON or edit this file for ChatAnywhere rates.
# Audio input for gpt-4o-*-audio is billed as tokens in Chat Completions usage;
# if an endpoint separately bills audio-seconds, set audio_input_per_minute.

models:
  gpt-4o-mini:
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  gpt-4o-mini-audio-preview:
    input_per_mtok: 0.15
    output_per_mtok: 0.60
    # OpenAI also publishes audio rates; usage.prompt_tokens usually already
    # includes audio. Keep audio_input_per_minute at 0 when trusting usage.
    audio_input_per_minute: 0.0
  gpt-4o-audio-preview:
    input_per_mtok: 2.50
    output_per_mtok: 10.00
    audio_input_per_minute: 0.0
  gpt-4o:
    input_per_mtok: 2.50
    output_per_mtok: 10.00

