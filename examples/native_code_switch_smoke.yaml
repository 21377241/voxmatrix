schema_version: evaluation-suite-config/1.0
run_id: native-code-switch-smoke
model: qwen3-omni-local
output_root: outputs/native_code_switch_smoke
registry_paths:
  - mesh_eval/registry
  - suites/native/registry
model_pool:
  use_model_pool: 'off'
  replicas: 1
  gpus_per_replica: 1
  inference_workers: 1
  allow_gpu_sharing: false
  model_ready_policy: auto
suite_aggregation:
  enabled: true
  report_format: both
  min_slice_size: 1
benchmarks:
  - {benchmark_id: native-code-switch-mmsu-smoke, dataset: native-code-switch-mmsu, task: aqa, prompt: mesh-external-qa, evaluator: mesh-rouge-l, agg: mean, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-code-switch-vocalbench-zh-smoke, dataset: native-code-switch-vocalbench-zh, task: aqa, prompt: mesh-external-qa, evaluator: qa-exist-match, agg: acc, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-code-switch-vocalbench-zh-open-ended-smoke, dataset: native-code-switch-vocalbench-zh-open-ended, task: aqa, prompt: mesh-code-switch-open-ended, evaluator: mesh-rouge-l, agg: mean, limit: 10, evaluation_workers: 1}
