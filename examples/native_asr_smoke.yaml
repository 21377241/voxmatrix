schema_version: evaluation-suite-config/1.0
run_id: native-asr-smoke-rebuilt
model: qwen3-omni-local
output_root: outputs/native_asr_smoke_rebuilt
registry_paths:
  - mesh_eval/registry
  - suites/native/registry
model_pool:
  use_model_pool: 'off'
  replicas: 1
  gpus_per_replica: 1
  inference_workers: 1
  allow_gpu_sharing: false
  model_ready_policy: auto
suite_aggregation:
  enabled: true
  report_format: both
  min_slice_size: 1
benchmarks:
  - {benchmark_id: native-asr-aishell-1-rebuilt, dataset: native-asr-aishell-1, task: asr-zh, prompt: qwen3-omni-asr-zh, evaluator: cer, agg: wer-zh, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-aishell-5-rebuilt, dataset: native-asr-aishell-5, task: asr-zh, prompt: qwen3-omni-asr-zh, evaluator: cer, agg: wer-zh, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-common-voice-rebuilt, dataset: native-asr-common-voice, task: asr-3o, prompt: qwen3-omni-asr-en, evaluator: wer, agg: wer, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-librispeech-rebuilt, dataset: native-asr-librispeech, task: asr-3o, prompt: qwen3-omni-asr-en, evaluator: wer, agg: wer, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-magicdata-rebuilt, dataset: native-asr-magicdata-ramc, task: asr-zh, prompt: qwen3-omni-asr-zh, evaluator: cer, agg: wer-zh, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-sbcsae-rebuilt, dataset: native-asr-sbcsae, task: asr-3o, prompt: qwen3-omni-asr-en, evaluator: wer, agg: wer, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-asr-wenetspeech-rebuilt, dataset: native-asr-wenetspeech, task: asr-zh, prompt: qwen3-omni-asr-zh, evaluator: cer, agg: wer-zh, limit: 10, evaluation_workers: 1}
