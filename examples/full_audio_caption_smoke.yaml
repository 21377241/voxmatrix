schema_version: evaluation-suite-config/1.0
run_id: full-audio-caption-smoke
model: qwen3-omni-local
output_root: outputs/full_audio_caption_smoke
registry_paths:
  - mesh_eval/registry
  - suites/native/registry
model_pool:
  use_model_pool: 'off'
  replicas: 1
  gpus_per_replica: 1
  inference_workers: 1
  allow_gpu_sharing: false
  model_ready_policy: auto
suite_aggregation:
  enabled: true
  report_format: both
  min_slice_size: 1
benchmarks:
  - {benchmark_id: full-audio-caption-audiocaps-smoke, dataset: full-audio-caption-audiocaps, task: caption, prompt: qwen3-omni-audio-caption, evaluator: fense, agg: fense, limit: 10, evaluation_workers: 1}
  - {benchmark_id: full-audio-caption-clotho-smoke, dataset: full-audio-caption-clotho, task: caption, prompt: qwen3-omni-audio-caption, evaluator: fense, agg: fense, limit: 10, evaluation_workers: 1}
