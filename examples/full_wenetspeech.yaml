schema_version: evaluation-suite-config/1.0
run_id: full-wenetspeech-asr
model: qwen3-omni-local
output_root: outputs/full_wenetspeech_asr
registry_paths:
  - mesh_eval/registry
  - registry

model_pool:
  use_model_pool: auto
  replicas: 0
  gpus_per_replica: 1
  inference_workers: 0
  allow_gpu_sharing: false
  model_ready_policy: auto

suite_aggregation:
  enabled: true
  report_format: both
  min_slice_size: 1

benchmarks:
  - benchmark_id: full-wenetspeech-test-net
    dataset: full-wenetspeech-test-net
    task: asr-zh
    prompt: qwen3-omni-asr-zh
    evaluator: cer
    agg: wer-zh
    limit: 0
    evaluation_workers: 1
  - benchmark_id: full-wenetspeech-test-meeting
    dataset: full-wenetspeech-test-meeting
    task: asr-zh
    prompt: qwen3-omni-asr-zh
    evaluator: cer
    agg: wer-zh
    limit: 0
    evaluation_workers: 1
