schema_version: evaluation-suite-config/1.0
run_id: native-translation-smoke
model: qwen3-omni-local
output_root: outputs/native_translation_smoke
registry_paths:
  - mesh_eval/registry
  - suites/native/registry
model_pool:
  use_model_pool: 'off'
  replicas: 1
  gpus_per_replica: 1
  inference_workers: 1
  allow_gpu_sharing: false
  model_ready_policy: auto
suite_aggregation:
  enabled: true
  report_format: both
  min_slice_size: 1
benchmarks:
  - {benchmark_id: native-covost2-zh-en-smoke, dataset: native-speech-translation-covost2-zh-en, task: speech-translation-zh-en, prompt: qwen3-omni-s2tt-zh2en, evaluator: bleu, agg: bleu, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-covost2-en-zh-smoke, dataset: native-speech-translation-covost2-en-zh, task: speech-translation-en-zh, prompt: qwen3-omni-s2tt-en2zh, evaluator: bleu, agg: bleu, limit: 10, evaluation_workers: 1}
  - {benchmark_id: native-mmsu-translation-smoke, dataset: native-speech-translation-mmsu, task: speech-translation-mmsu, prompt: mesh-external-qa, evaluator: bleu, agg: bleu, limit: 10, evaluation_workers: 1}
