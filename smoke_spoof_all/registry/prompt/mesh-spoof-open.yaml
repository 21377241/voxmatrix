mesh-spoof-open:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"
          - type: text
            value: >-
              Is this speech real (spoken by a human) or fake (synthesized)?
              Return JSON only as {"label":"real"} or {"label":"fake"}.
