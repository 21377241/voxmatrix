meld-emo:
  class: audio_evals.dataset.huggingface.Huggingface
  args:
    name: TwinkStart/MELD
    split: test
    local_path: "${VOXMATRIX_HF_DATA_ROOT:-data/hf}/MELD_c"
    default_task: emotion_analysis
    ref_col: Emotion

meld-sentiment:
  class: audio_evals.dataset.huggingface.Huggingface
  args:
    name: TwinkStart/MELD
    split: test
    local_path: "${VOXMATRIX_HF_DATA_ROOT:-data/hf}/MELD_c"
    default_task: sentiment_analysis
    ref_col: Sentiment
