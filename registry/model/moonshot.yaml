# env built by scripts/build_model_envs.sh kimiaudio (torch 2.6 + local flash-attn wheel).
kimiaudio:
  class: audio_evals.models.moonshot.KimiAudioModel
  args:
    model_path: /mnt/afs/models/Kimi-Audio-7B-Instruct
    audio_tokenizer_path: /mnt/afs/models/glm-4-voice-tokenizer
    env_path: envs/kimiaudio
    requirements_path: ""

kimiaudio-speech:
  class: audio_evals.models.moonshot.KimiAudioModel
  args:
    model_path: /mnt/afs/models/Kimi-Audio-7B-Instruct
    audio_tokenizer_path: /mnt/afs/models/glm-4-voice-tokenizer
    speech: True
    speech_output_dir: ${NATIVE_OUTPUT_DIR:-/mnt/afs/users/wangyl/VoxMatrix-clean/outputs/native_runs/unscoped}/tts/speech_wavs
    env_path: envs/kimiaudio
    requirements_path: ""
