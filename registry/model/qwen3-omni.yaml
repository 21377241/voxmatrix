qwen3-omni-audio:
  class: audio_evals.models.qwen3_omni.Qwen3Omni
  args:
    path: /mnt/afs/models/Qwen3-Omni-30B-A3B-Instruct
    env_path: envs/qwen3-omni
    requirements_path: audio_evals/lib/qwen3-omni/requirements.txt

qwen3-omni-speech:
  class: audio_evals.models.qwen3_omni.Qwen3Omni
  args:
    path: /mnt/afs/models/Qwen3-Omni-30B-A3B-Instruct
    speech: true
    speaker: Ethan
    env_path: envs/qwen3-omni
    requirements_path: audio_evals/lib/qwen3-omni/requirements.txt

# Cap thinker tokens for judge speed; 128 caused widespread parse_failed (truncated CoT).
# 512 keeps short score answers while allowing enough reasoning to emit the final score.
qwen3-omni-thinking:
  class: audio_evals.models.qwen3_omni.Qwen3Omni
  args:
    path: /mnt/afs/models/Qwen3-Omni-30B-A3B-Thinking
    max_new_tokens: 2048
    env_path: envs/qwen3-omni
    requirements_path: audio_evals/lib/qwen3-omni/requirements.txt
