gpt4:
  class: audio_evals.models.openai.GPT
  args:
    model_name: 'gpt-4'

gpt4o-mini:
  class: audio_evals.models.openai.GPT
  args:
    model_name: 'gpt-4o-mini'

# Optional Chat Completions audio-input judge (template B fallback).
# Default B judge is local qwen3-omni-thinking; override via MESH_MM_JUDGE_MODEL.
gpt4o-mini-audio:
  class: audio_evals.models.openai.AdvancedGPT
  args:
    model_name: 'gpt-4o-mini-audio-preview-2024-12-17'
    modalities:
      - text

gpt4o-audio:
  class: audio_evals.models.openai.AdvancedGPT
  args:
    model_name: 'gpt-4o-audio-preview-2024-12-17'
    modalities:
      - text

gpt4o_audio:
  class: audio_evals.models.openai_realtime.GPT4oAudio
  args:
    model_name: 'gpt-4o-realtime-preview-2024-10-01'
    modalities:
      - text


gpt4o_speech:
  class: audio_evals.models.openai_realtime.GPT4oAudio
  args:
    model_name: 'gpt-4o-realtime-preview-2024-10-01'
    modalities:
      - audio
      - text

gpt4o_audio_ms:
  class: audio_evals.models.openai_realtime.GPT4oAudio
  args:
    model_name: 'gpt-4o-realtime-preview-2024-10-01'
    modalities:
      - text
    is_azure: True


gpt4o_speech_ms:
  class: audio_evals.models.openai_realtime.GPT4oAudio
  args:
    model_name: 'gpt-4o-realtime-preview-2024-10-01'
    modalities:
      - audio
      - text
    is_azure: True

gpt4o_transcribe:
  class: audio_evals.models.openai.AudioTranscribe
  args:
    model_name: gpt-4o-transcribe
