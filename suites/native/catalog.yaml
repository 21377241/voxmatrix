# Native all-capability small-n entry.
# One loader per (benchmark, capability). Schemes follow smoke_* / 8p31.
# Annotation routing: annotation/benchmark_subset_manifest.jsonl.

schema_version: native-catalog/1.0
limit: 10
model: qwen3-omni-local
speech_model: qwen3-omni-speech-local
annotation_baseline: annotation/benchmark_subset_manifest.jsonl

capabilities:
  - id: asr
    status: ok
    suite: main
    dataset: full-aishell-1-asr
    subset_record_id: aishell_1__test__test__asr__asr__unknown__unknown__3a129bce7a
    prompt: qwen3-omni-asr-zh
    evaluator: cer
    agg: wer-zh
    note: Official short-utterance AISHELL-1. Same unit as smoke_asr_all.

  - id: long_form_asr
    status: diagnostic
    suite: main
    dataset: native-aishell4-utt-asr
    subset_record_id: aishell_4__test__test__long_form_asr__long_form_asr__meeting__large_meeting__2bf30d7eb0
    prompt: qwen3-omni-asr-zh
    evaluator: cer
    agg: wer-zh
    note: smoke_asr_all utt_clips. Pre-cut short wavs, not unsegmented meetings.

  - id: speech_translation
    status: ok
    suite: main
    dataset: full-covost2-zh-en
    subset_record_id: covost2__test__zh-CN_en_test__speech_translation__speech_translation__unknown__unknown__49817674b9
    prompt: qwen3-omni-s2tt-zh2en
    evaluator: bleu
    agg: bleu
    note: CoVoST2 zh→en S2TT. FullEval also binds chrf; catalog primary is BLEU.

  - id: code_switch
    status: diagnostic
    suite: main
    dataset: native-vocalbench-zh-code-switch
    subset_record_id: vocalbench_zh__test__code_switch_knowledge__code_switch__code_switch__unknown__unknown__c1c194e290
    prompt: mesh-external-qa
    evaluator: qa-exist-match
    agg: acc
    note: smoke_cs_all knowledge short-QA track. No MER. Do not pool with open/ROUGE.

  - id: qa
    status: ok
    suite: main
    dataset: full-spoken-squad-qa
    subset_record_id: spoken_squad__test__test_wer44__qa__qa__unknown__unknown__b750ba6502
    prompt: mesh-external-qa
    evaluator: qa-exist-match
    agg: acc
    note: 8p31 short exist-match. uro-basic-content and vocalbench-qa-split stay registered for split reruns.

  - id: audio_reasoning
    status: diagnostic
    suite: main
    dataset: full-mmsu-audio-reasoning
    subset_record_id: mmsu__test__reasoning_subtasks__audio_reasoning__audio_reasoning__unknown__unknown__7c8c7c228d
