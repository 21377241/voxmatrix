version: "2026-08-19"
full_eval_root: "${VOXMATRIX_FULL_EVAL_ROOT:-data/full_eval}"

aliases:
  WenetSpeech-test-net: wenetspeech-test-net
  WenetSpeech-test-meeting: wenetspeech-test-meeting
  MMSU: full-mmsu-audio-reasoning
  VocalBench: full-vocalbench-qa
  VocalBench-zh: full-vocalbench-zh-qa
  URO-Bench: full-uro-bench-qa
  AudioAgentBench: audio-agent-bench-dialogue
  IHBench: ihbench-interruption-offline

benchmarks:
  librispeech-test-clean:
    display_name: LibriSpeech test-clean
    group: current_asr
    registry_dataset: librispeech-test-clean
    task: speech_understanding
    capability: asr
    answer_type: text
    language: en
    scenario: phone
    condition: {acoustic: clean, spatial: near_field, speaker: single_speaker, device: phone_mic, interaction: single_turn}
    metrics: [wer]
    evaluators: [wer]
    prompt: qwen3-omni-asr-en
    use_bucket: formal_subscores
    annotation_mapping: librispeech-test-clean
    data:
      local_path: "${VOXMATRIX_HF_DATA_ROOT:-data/hf}/librispeech_c"
      split: test_clean
      raw_audio_path: "${VOXMATRIX_RAW_ROOT:-raw}/TwinkStart/librispeech/test_clean"
    smoke_status: ready_after_inference

