  spoken_agentic_interaction/tool_call@1: {task: spoken_agentic_interaction, capability: tool_call, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, parameter_f1, task_success]}
  spoken_agentic_interaction/navigation@1: {task: spoken_agentic_interaction, capability: navigation, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/calendar@1: {task: spoken_agentic_interaction, capability: calendar, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/reminder@1: {task: spoken_agentic_interaction, capability: reminder, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/phone_message@1: {task: spoken_agentic_interaction, capability: phone_message, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/music_control@1: {task: spoken_agentic_interaction, capability: music_control, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/vehicle_control@1: {task: spoken_agentic_interaction, capability: vehicle_control, input_schema: audio_instruction@1, output_schema: tool_call@1, parser: structured_json@1, required_reference: [expected_output], prompt: direct-aqa, metrics: [tool_acc, parameter_acc, task_success]}
  spoken_agentic_interaction/translation_instruction@1: {task: spoken_agentic_interaction, capability: translation_instruction, input_schema: audio_instruction@1, output_schema: translation_text@1, parser: answer_text@1, required_reference: [text], prompt: direct-aqa, metrics: [bleu, chrf]}
  spoken_agentic_interaction/multi_turn_dialogue@1: {task: spoken_agentic_interaction, capability: multi_turn_dialogue, input_schema: audio_dialogue@1, output_schema: dialogue@1, parser: dialogue@1, required_reference: [turns], prompt: direct-aqa, metrics: [task_success]}
  spoken_agentic_interaction/clarification@1: {task: spoken_agentic_interaction, capability: clarification, input_schema: audio_dialogue@1, output_schema: dialogue@1, parser: dialogue@1, required_reference: [turns], prompt: direct-aqa, metrics: [task_success]}
  spoken_agentic_interaction/interruption@1: {task: spoken_agentic_interaction, capability: interruption, input_schema: audio_dialogue@1, output_schema: dialogue@1, parser: dialogue@1, required_reference: [turns], prompt: direct-aqa, metrics: [task_success]}
  speech_generation_delivery/speech_generation@1: {task: speech_generation_delivery, capability: speech_generation, input_schema: speech_generation_input@1, output_schema: audio@1, parser: generated_audio@1, required_reference: [text], prompt: tts, metrics: [content_acc, intelligibility, sim, mos, dnsmos]}
