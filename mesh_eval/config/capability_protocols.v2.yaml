schema_version: "capability-protocol-registry/2.0"
runtime_profile: ondevice_audio@1
protocols:
  speech_recognition_transcription/asr@1: {task: speech_recognition_transcription, capability: asr, input_schema: audio_single@1, output_schema: transcript@1, parser: transcript_text@1, required_reference: [text], prompt: asr, metrics: [wer, cer]}
  speech_recognition_transcription/long_form_asr@1: {task: speech_recognition_transcription, capability: long_form_asr, input_schema: audio_single@1, output_schema: transcript@1, parser: transcript_text@1, required_reference: [text], prompt: asr, metrics: [wer]}
  speech_recognition_transcription/speech_translation@1: {task: speech_recognition_transcription, capability: speech_translation, input_schema: audio_single@1, output_schema: translation_text@1, parser: transcript_text@1, required_reference: [text], prompt: direct-aqa, metrics: [bleu, chrf]}
  speech_recognition_transcription/code_switch@1: {task: speech_recognition_transcription, capability: code_switch, input_schema: audio_single@1, output_schema: transcript@1, parser: transcript_text@1, required_reference: [text], prompt: asr, metrics: [mer, entity_f1]}
  audio_speech_understanding/audio_reasoning@1: {task: audio_speech_understanding, capability: audio_reasoning, input_schema: audio_question@1, output_schema: answer@1, parser: answer_text@1, required_reference: [answer], prompt: direct-aqa, metrics: [accuracy]}
  audio_speech_understanding/audio_caption@1: {task: audio_speech_understanding, capability: audio_caption, input_schema: audio_single@1, output_schema: caption@1, parser: answer_text@1, required_reference: [caption], prompt: direct-aqa, metrics: [cider]}
  audio_speech_understanding/sound_event@1: {task: audio_speech_understanding, capability: sound_event, input_schema: audio_single@1, output_schema: labels@1, parser: classification@1, required_reference: [events], prompt: direct-aqa, metrics: [accuracy, macro_f1]}
  audio_speech_understanding/acoustic_scene@1: {task: audio_speech_understanding, capability: acoustic_scene, input_schema: audio_single@1, output_schema: label@1, parser: classification@1, required_reference: [scene_label], prompt: direct-aqa, metrics: [accuracy]}
  audio_speech_understanding/paralinguistic_recognition@1: {task: audio_speech_understanding, capability: paralinguistic_recognition, input_schema: audio_single@1, output_schema: labels@1, parser: classification@1, required_reference: [attributes], prompt: direct-aqa, metrics: [accuracy, macro_f1]}
  audio_speech_understanding/qa@1: {task: audio_speech_understanding, capability: qa, input_schema: audio_question@1, output_schema: answer@1, parser: answer_text@1, required_reference: [answer], prompt: direct-aqa, metrics: [exact_match, text_f1]}
  audio_speech_understanding/meeting_summary@1: {task: audio_speech_understanding, capability: meeting_summary, input_schema: audio_multi@1, output_schema: summary@1, parser: answer_text@1, required_reference: [summary], prompt: direct-aqa, metrics: [rouge_l]}
  audio_speech_understanding/meeting_qa@1: {task: audio_speech_understanding, capability: meeting_qa, input_schema: audio_question@1, output_schema: answer@1, parser: answer_text@1, required_reference: [answer], prompt: direct-aqa, metrics: [exact_match, text_f1]}
  audio_speech_understanding/timeline_query@1: {task: audio_speech_understanding, capability: timeline_query, input_schema: audio_question@1, output_schema: answer@1, parser: answer_text@1, required_reference: [answer], prompt: direct-aqa, metrics: [exact_match, text_f1]}
  audio_speech_understanding/todo_extraction@1: {task: audio_speech_understanding, capability: todo_extraction, input_schema: audio_multi@1, output_schema: structured_json@1, parser: structured_json@1, required_reference: [todos], prompt: direct-aqa, metrics: [slot_f1]}
  speaker_attribution/speaker_count@1: {task: speaker_attribution, capability: speaker_count, input_schema: audio_single@1, output_schema: count@1, parser: classification@1, required_reference: [count], prompt: direct-aqa, metrics: [speaker_count_acc]}
  speaker_attribution/speaker_verification@1: {task: speaker_attribution, capability: speaker_verification, input_schema: audio_pair@1, output_schema: binary_label@1, parser: classification@1, required_reference: [same_speaker], prompt: direct-aqa, metrics: [eer, auc]}
  speaker_attribution/diarization@1: {task: speaker_attribution, capability: diarization, input_schema: audio_single@1, output_schema: speaker_segments@1, parser: structured_json@1, required_reference: [segments], prompt: direct-aqa, metrics: [der]}
  speaker_attribution/speaker_attribution@1: {task: speaker_attribution, capability: speaker_attribution, input_schema: audio_single@1, output_schema: attributed_utterances@1, parser: structured_json@1, required_reference: [utterances], prompt: direct-aqa, metrics: [cpcer, attribution_acc]}
  speaker_attribution/target_speaker@1: {task: speaker_attribution, capability: target_speaker, input_schema: audio_pair@1, output_schema: action_gate@1, parser: classification@1, required_reference: [should_execute], prompt: direct-aqa, metrics: [target_speaker_acc, mis_execution]}
